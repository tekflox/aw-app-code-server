name: Build Code Server image

# Builds the code-server image and pushes it to ghcr.io/<owner>/aw-app-code-server.
# Push builds run only for release bump commits so `latest` follows the tagged
# manifest release. Manual rebuilds remain available via workflow_dispatch.
#
#   gh workflow run build.yml                        # amd64
#   gh workflow run build.yml -f include_arm64=true  # + linux/arm64 (QEMU)
#
# One-time manual step after the FIRST push: the package is created private
# regardless of this repo's own visibility, and GitHub has no REST/GraphQL
# endpoint to change a container package's visibility (see aw-app-browser's
# build.yml for the full write-up). Flip it by hand at:
#   github.com/orgs/tekflox/packages/container/aw-app-code-server/settings
#   -> Package settings -> Danger Zone -> Change visibility -> Public
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      include_arm64:
        description: 'Also build linux/arm64 (QEMU emulation; slower)'
        type: boolean
        default: false

concurrency:
  group: build-aw-app-code-server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[skip release]')) }}
    name: aw-app-code-server
    runs-on: [self-hosted, aw-baremetal]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io rejects mixed-case namespaces — lowercase the owner login.
      - name: Lowercase repo owner
        id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve platforms
        id: plat
        run: |
          if [ "${{ inputs.include_arm64 }}" = "true" ]; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Read app version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print(f"version={json.load(open('aw-app.json'))['version']}")
          PY

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/Dockerfile
          platforms: ${{ steps.plat.outputs.platforms }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/aw-app-code-server:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/aw-app-code-server:v${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.lc }}/aw-app-code-server:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.owner.outputs.lc }}/aw-app-code-server:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.owner.outputs.lc }}/aw-app-code-server:buildcache,mode=max

      - name: Summary
        run: |
          {
            echo "## 🐳 aw-app-code-server pushed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Image** | \`ghcr.io/${{ steps.owner.outputs.lc }}/aw-app-code-server:latest\` |"
            echo "| **Version tag** | \`ghcr.io/${{ steps.owner.outputs.lc }}/aw-app-code-server:v${{ steps.version.outputs.version }}\` |"
            echo "| **Platforms** | ${{ steps.plat.outputs.platforms }} |"
          } >> "$GITHUB_STEP_SUMMARY"
